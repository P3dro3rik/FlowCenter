name: CI Pipeline

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore FlowCenter.sln

      - name: Compilar solução (Build)
        run: dotnet build FlowCenter.sln --configuration Release --no-restore

      - name: Executar testes unitários
        run: dotnet test FlowCenter.sln --configuration Release --no-build --verbosity normal